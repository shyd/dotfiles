set -g default-terminal "screen-256color"
set -g mouse on
set -g terminal-overrides 'xterm*:smcup@:rmcup@'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# scroll only 1 line instead of 5 with mouse wheel
bind -Tcopy-mode-vi WheelUpPane send -N1 -X scroll-up
bind -Tcopy-mode-vi WheelDownPane send -N1 -X scroll-down

# 0 is too far from ` ;)
set -g base-index 1

bind-key v split-window -h
bind-key s split-window -v
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Use Alt-arrow keys without prefix key to resize panes
bind-key -n M-Down resize-pane -D
bind-key -n M-Up resize-pane -U
bind-key -n M-Left resize-pane -L
bind-key -n M-Right resize-pane -R

# Use Shift-arrow keys without prefix key to switch panes
bind -n S-Left select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up select-pane -U
bind -n S-Down select-pane -D

# Shift pg-up/down to switch windows
bind -n S-Pagedown previous-window
bind -n S-Pageup next-window

# No delay for escape key press
set -sg escape-time 0

# Reload tmux config
bind r source-file ~/.tmux.conf

## ANSI theme-aware status bar
# Named tmux colors resolve through the active terminal theme; backgrounds remain transparent.
set -g status on
set -g status-position bottom
set -g status-style 'fg=default,bg=default'
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=cyan'
set -g message-style 'fg=black,bg=yellow'
set -g mode-style 'fg=black,bg=yellow'

set -g status-left-length 40
set -g status-right-length 80
set -g status-left '#[fg=cyan,bold] #S #[fg=default,nobold]'
set -g window-status-format '#[fg=brightblack] #I:#W #[fg=default]'
set -g window-status-current-format '#[fg=green,bold] #I:#W #[fg=default,nobold]'
set -g status-right '#[fg=brightblack]%Y-%m-%d #[fg=blue,bold]%H:%M #[fg=default,nobold]'

set -g @resurrect-capture-pane-contents 'on'

run -b '~/.tmux/plugins/tpm/tpm'
